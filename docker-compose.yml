# docker-compose.yml — the local infrastructure the app requires to boot.
#
# Postgres is pinned to 18 because the migrations use uuidv7() as a column
# default, which is built in from 18. On 17 or older the migration aborts
# with "function uuidv7() does not exist" unless an extension is installed.
#
# Host ports are non-default (5433, 6380) on purpose: the two most commonly
# installed local dev services are a native Postgres and a native Redis,
# both of which default to 5432/6379. On a machine running either, a native
# bind on 127.0.0.1 wins over Docker's wildcard bind for connections to
# "localhost" — Postgres then fails loudly ("role does not exist"), but
# Redis fails silently, since any Redis answers PING and the test suite
# would pass against a developer's personal instance without ever touching
# this stack. Container-internal ports stay 5432/6379 — a URL like
# postgres://…@postgres:5432/… (container-to-container) is unaffected.
#
# No app service: the app runs on the host with APP_ENV=local (.env.example),
# which is what lets it use Mailpit and the defaults below.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: boilerplate
      POSTGRES_PASSWORD: boilerplate
      POSTGRES_DB: boilerplate
    ports: ['5433:5432']
    volumes:
      # postgres:18+ images store data under a major-version-specific
      # subdirectory of /var/lib/postgresql (pg_ctlcluster-compatible
      # layout) rather than directly under /var/lib/postgresql/data as
      # earlier images did — mounting at .../data here fails to start
      # ("unused mount/volume", verified against this exact image/tag).
      # Mount the parent directory instead, per the image's own guidance.
      - pgdata:/var/lib/postgresql
      # Runs once against an empty volume: provisions the test/test/
      # boilerplate_test role+database that .env.test already points at,
      # separate from the boilerplate dev database above.
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U boilerplate']
      interval: 5s
      timeout: 5s
      retries: 10

  # Shared by `pnpm dev` and the test suite. Each writes under its own
  # REDIS_KEY_PREFIX (express-boilerplate by default, test-w<N> per test worker).
  redis:
    image: redis:7.2-alpine
    ports: ['6380:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ['--config=/etc/otel/config.yaml']
    # Bind-mounted: editing otel-collector.yaml needs
    # `docker compose restart otel-collector` — `docker compose up -d` does
    # not pick up bind-mount content changes on an already-running container.
    volumes: ['./otel-collector.yaml:/etc/otel/config.yaml:ro']
    # 13133 is the health_check extension's endpoint (see otel-collector.yaml)
    # — exposed for manual/host-side verification. No Docker HEALTHCHECK
    # here: the image has no shell/wget/curl to run one from inside the
    # container (verified; see otel-collector.yaml's comment).
    ports: ['4318:4318', '13133:13133']

  tempo:
    # Single-binary Tempo (all components in one process) — the local-dev
    # profile, not what a real deployment would run. See docker/tempo/config.yaml.
    image: grafana/tempo:2.6.1
    command: ['-config.file=/etc/tempo/config.yaml']
    volumes:
      - ./docker/tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    ports: ['3200:3200'] # Tempo API + query frontend

  loki:
    # Single-binary Loki with the image's bundled local config (tsdb, schema
    # v13 — required for OTLP ingest and structured metadata). No host port:
    # Grafana already owns host 3100, and nothing outside the compose network
    # needs Loki directly — query it through Grafana.
    image: grafana/loki:3.7.8
    command: ['-config.file=/etc/loki/local-config.yaml']

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      # Anonymous admin access — this stack is local-dev only (no auth
      # anywhere else in it either: the collector, Tempo, and Mailpit are all
      # unauthenticated on their own ports). Do not carry this env block into
      # any shared/hosted environment.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    ports: ['3100:3000'] # 3100, not the image's default 3000 — avoids colliding with a locally-run frontend dev server.
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [tempo, loki]

  mailpit:
    # Pinned, like every other service on this file — an unpinned :latest
    # here is the one inconsistency task-2-review.md's finding 5 caught:
    # every sibling service (postgres:18, redis:7.2-alpine) is pinned, and a
    # silent upstream change to Mailpit's API or its readyz subcommand would
    # otherwise turn into a red run on an unrelated change. v1.31.1 is the
    # version this task actually developed and tested against.
    image: axllent/mailpit:v1.31.1
    # --smtp-disable-rdns: Mailpit performs a reverse-DNS lookup on every
    # connecting IP by default. Inside Docker-for-Mac the lookup targets the
    # host's gateway address, which has no PTR record and times out after ~8
    # seconds — long enough for any fire-and-forget test to fail before the
    # mail arrives. Disabling it brings the SMTP greeting down to < 50ms.
    # The app's SMTP defaults (localhost:1025, no auth) point here; boot
    # refuses that host and port whenever APP_ENV is not local.
    command: ['--smtp-disable-rdns']
    ports: ['1025:1025', '8025:8025']
    # `readyz` is the image's own subcommand for exactly this — verified
    # against the running container (it has a working shell, `docker exec
    # ... sh -c 'echo ok'` succeeds), so this needs none of otel-collector's
    # "no shell to run a healthcheck from" workaround below.
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  tempo-data:
