# The local infrastructure the app needs to boot, and two opt-in profiles
# that also run the API, react-boilerplate and apex-boilerplate in containers.
#
# Every service without a `profiles:` key is infrastructure: plain
# `docker compose up -d --wait` starts only those, and the README, CI and the
# test suite rely on that. Every app service sits behind a profile:
#
#   dev   api-dev, react-dev, apex-dev: source bind-mounted, hot reload.
#   prod  migrate, api, react, apex: the real images, built from each
#         repo's own Dockerfile.
#
# Both profiles publish the same host ports (4040, 5173, 5174), so run one at
# a time. The frontends build from sibling checkouts, ../react-boilerplate and
# ../apex-boilerplate by default; REACT_DIR and APEX_DIR override the paths.
# The app services read the developer's .env (env_file) and override only what
# differs inside the compose network: the Postgres, Redis and Mailpit hosts.
# See "Run everything with Docker" in the README.
#
# Postgres is pinned to 18 because the migrations use uuidv7() as a column
# default, which is built in from 18. On 17 or older the migration aborts
# with "function uuidv7() does not exist" unless an extension is installed.
#
# Host ports are 5433 and 6380 so they never meet a native Postgres or Redis
# on 5432/6379. Connecting to a native Postgres fails loudly ("role does not
# exist"); a native Redis fails silently, since any Redis answers PING and the
# suite would pass against a developer's own instance. Container-internal
# ports stay 5432/6379.
#
# Without a profile the app runs on the host with APP_ENV=local
# (.env.example), which lets it use Mailpit and the defaults below.
#
# Every host-side port binds 127.0.0.1 explicitly. By default Docker
# publishes a port on every interface, and on Linux its own iptables rules
# bypass a host firewall such as ufw, so a default-bound port is reachable
# from the rest of the network even where the firewall would block it.

# Shared by api-dev, react-dev and apex-dev: the node:24-alpine that express's
# Dockerfile pins, by the same digest. Each dev command installs corepack the
# way the Dockerfiles do, since Node 25+ does not bundle it, and corepack then
# runs the pnpm that package.json's packageManager names. init: true makes
# `down` stop the shell-started process at once instead of after 10 seconds.
x-node-dev: &node-dev
  image: node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
  working_dir: /app
  init: true

x-dev-env: &dev-env
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  # Every repo's `prepare` script runs husky, which has no git in here.
  HUSKY: '0'

# What differs for the API inside the compose network: the infrastructure is
# reached by service name on its container port, not on localhost's 5433,
# 6380 and 1025. Postgres's credentials are the ones its service sets below.
x-in-network: &in-network
  DATABASE_URL: &database-url postgres://boilerplate:boilerplate@postgres:5432/boilerplate
  REDIS_URL: redis://redis:6379
  SMTP_HOST: mailpit
  SMTP_PORT: '1025'

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: boilerplate
      POSTGRES_PASSWORD: boilerplate
      POSTGRES_DB: boilerplate
    ports: ['127.0.0.1:5433:5432']
    volumes:
      # postgres:18+ keeps its data in a major-version subdirectory of
      # /var/lib/postgresql, and refuses to start with a volume at .../data,
      # so the parent directory is mounted, as the image documents.
      - pgdata:/var/lib/postgresql
      # Runs once against an empty volume: provisions the test/test/
      # boilerplate_test role+database that .env.test already points at,
      # separate from the boilerplate dev database above.
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U boilerplate']
      interval: 5s
      timeout: 5s
      retries: 10

  # Shared by `pnpm dev` and the test suite. Each writes under its own
  # REDIS_KEY_PREFIX (express-boilerplate by default, test-w<N> per test worker).
  redis:
    image: redis:7.2-alpine
    ports: ['127.0.0.1:6380:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    command: ['--config=/etc/otel/config.yaml']
    # Bind-mounted: editing otel-collector.yaml needs
    # `docker compose restart otel-collector` — `docker compose up -d` does
    # not pick up bind-mount content changes on an already-running container.
    volumes: ['./otel-collector.yaml:/etc/otel/config.yaml:ro']
    # 13133 is the health_check extension's endpoint, for checks from the
    # host. No Docker HEALTHCHECK: the image has no shell, wget or curl.
    ports: ['127.0.0.1:4318:4318', '127.0.0.1:13133:13133']

  tempo:
    # Single-binary Tempo (all components in one process) — the local-dev
    # profile, not what a real deployment would run. See docker/tempo/config.yaml.
    image: grafana/tempo:2.6.1
    command: ['-config.file=/etc/tempo/config.yaml']
    volumes:
      - ./docker/tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    ports: ['127.0.0.1:3200:3200'] # Tempo API + query frontend

  loki:
    # Single-binary Loki with the image's bundled local config (tsdb, schema
    # v13 — required for OTLP ingest and structured metadata). No host port:
    # Grafana already owns host 3100, and nothing outside the compose network
    # needs Loki directly — query it through Grafana.
    image: grafana/loki:3.7.8
    command: ['-config.file=/etc/loki/local-config.yaml']

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      # Anonymous admin access — this stack is local-dev only (no auth
      # anywhere else in it either: the collector, Tempo, and Mailpit are all
      # unauthenticated on their own ports). Do not carry this env block into
      # any shared/hosted environment.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    ports: ['127.0.0.1:3100:3000'] # 3100, not the image's default 3000 — avoids colliding with a locally-run frontend dev server.
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [tempo, loki]

  mailpit:
    # Pinned, with the same tag as ci.yml's service: the tests read mail back
    # through Mailpit's HTTP API, so an upstream change to that API or to its
    # readyz subcommand must arrive as a deliberate bump.
    image: axllent/mailpit:v1.31.1
    # --smtp-disable-rdns: Mailpit performs a reverse-DNS lookup on every
    # connecting IP by default. Inside Docker-for-Mac the lookup targets the
    # host's gateway address, which has no PTR record and times out after ~8
    # seconds — long enough for any fire-and-forget test to fail before the
    # mail arrives. Disabling it brings the SMTP greeting down to < 50ms.
    # The app's SMTP defaults (127.0.0.1:1025, no auth) point here; boot
    # refuses that host and port whenever APP_ENV is not local.
    command: ['--smtp-disable-rdns']
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
    # `readyz` is the image's own readiness subcommand.
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Profile dev: `docker compose --profile dev up`. Hot reload, source mounted.
  # ---------------------------------------------------------------------------

  api-dev:
    <<: *node-dev
    profiles: [dev]
    volumes:
      - .:/app
      # A named volume over node_modules, so the container installs and keeps
      # Linux binaries (esbuild ships one per platform) and never sees or writes the host's.
      - express-node-modules:/app/node_modules
    env_file: .env
    environment:
      <<: [*in-network, *dev-env]
      # The published port below is 4040, so the server must listen there
      # whatever APP_PORT the .env sets.
      APP_PORT: '4040'
    # Migrations run in this command, before `pnpm dev`, rather than in a
    # separate one-shot service: one `pnpm install` on one node_modules
    # volume (two services would race to install into it), and tsx's watch
    # restarts never re-run them.
    command:
      - sh
      - -c
      - >-
        npm i -g corepack@0.36.0 --silent && corepack enable && corepack install &&
        pnpm install --frozen-lockfile --config.confirm-modules-purge=false &&
        pnpm db:migrate && exec pnpm dev
    # react-dev and apex-dev share this container's network namespace (see
    # them below), so their ports are published here, on the namespace's owner.
    ports:
      - '127.0.0.1:4040:4040'
      - '127.0.0.1:5173:5173'
      - '127.0.0.1:5174:5174'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:4040/health']
      interval: 10s
      timeout: 5s
      retries: 3
      # The first run installs every dependency before the server starts.
      start_period: 10m

  # react-dev and apex-dev run in api-dev's network namespace
  # (network_mode: service:api-dev). Both vite configs proxy /api to
  # http://localhost:4040, and react hard-codes it; inside this namespace
  # localhost:4040 IS the API, so neither frontend repo needs a change. The
  # cost: they share api-dev's ports, so their 5173/5174 are published on
  # api-dev, they can declare no ports or networks of their own, and
  # recreating api-dev leaves them without a network until they are
  # recreated too (`docker compose --profile dev up -d` does both).
  # Browser origins stay http://localhost:5173 and :5174, matching WEB_URL and
  # APEX_URL in .env. Each frontend's own node_modules lives in a named volume.
  react-dev:
    <<: *node-dev
    profiles: [dev]
    network_mode: 'service:api-dev'
    volumes:
      - ${REACT_DIR:-../react-boilerplate}:/app
      - react-node-modules:/app/node_modules
    environment: *dev-env
    command: &vite-dev
      - sh
      - -c
      - >-
        npm i -g corepack@0.36.0 --silent && corepack enable && corepack install &&
        pnpm install --frozen-lockfile --config.confirm-modules-purge=false &&
        exec pnpm exec vite --host 0.0.0.0 --strictPort
    depends_on: [api-dev]

  apex-dev:
    <<: *node-dev
    profiles: [dev]
    network_mode: 'service:api-dev'
    volumes:
      - ${APEX_DIR:-../apex-boilerplate}:/app
      - apex-node-modules:/app/node_modules
    environment: *dev-env
    command: *vite-dev
    depends_on: [api-dev]

  # ---------------------------------------------------------------------------
  # Profile prod: `docker compose --profile prod up --build`. The real images.
  # ---------------------------------------------------------------------------

  # Runs the image's migration entrypoint once, then exits; api waits for it
  # to succeed. It reads only DATABASE_URL (src/database/migrate.ts), so it
  # gets no .env. It carries its own build, the same Dockerfile as api (the
  # second build is a cache hit), so it never tries to pull an image.
  migrate:
    profiles: [prod]
    build: .
    command: ['node', 'dist/database/migrate.js']
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres: { condition: service_healthy }

  # NODE_ENV and APP_ENV come from .env as they are: with APP_ENV=local the
  # image boots against Mailpit with no further override. LOG_FORMAT falls
  # back to json, since the image has no pino-pretty.
  api:
    profiles: [prod]
    build: .
    env_file: .env
    environment:
      <<: *in-network
      APP_PORT: '4040'
    ports: ['127.0.0.1:4040:4040']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:4040/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Both frontend images build with their Dockerfiles' defaults: GIT_SHA=dev,
  # and no POSTHOG_SOURCEMAP_PROJECTS, so docker/upload-sourcemaps.sh skips the
  # upload. With no POSTHOG_KEY the runtime config leaves analytics off. nginx
  # serves on 8080 and proxies /api to API_UPSTREAM; it resolves that host
  # when it starts, so the api container must exist first. Read-only root
  # filesystem with a tmpfs /tmp, as both READMEs run them.
  react:
    profiles: [prod]
    build: ${REACT_DIR:-../react-boilerplate}
    read_only: true
    tmpfs: [/tmp]
    environment:
      API_UPSTREAM: http://api:4040
    ports: ['127.0.0.1:5173:8080']
    depends_on: [api]

  apex:
    profiles: [prod]
    build: ${APEX_DIR:-../apex-boilerplate}
    read_only: true
    tmpfs: [/tmp]
    environment:
      API_UPSTREAM: http://api:4040
    ports: ['127.0.0.1:5174:8080']
    depends_on: [api]

volumes:
  pgdata:
  tempo-data:
  express-node-modules:
  react-node-modules:
  apex-node-modules:
