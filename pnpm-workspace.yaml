# Each bypass here has a line in CONTRIBUTING.md, "Supply-chain bypasses".
allowBuilds:
  # bcrypt's install script runs node-gyp-build: it tests the prebuilt native
  # binding in the package's prebuilds/ for the host platform, or compiles one
  # via node-gyp. bcrypt is a native addon and does not work without it.
  bcrypt: true
  # esbuild: its postinstall checks the host platform's native binary and
  # downloads it when the optional per-platform package is missing.
  esbuild: true
  # msgpackr-extract: transitive dependency of bullmq (via msgpackr, which
  # BullMQ uses to encode job data for Redis). Its install script
  # (node-gyp-build-optional-packages) tests the prebuilt binding from an
  # optional per-platform package, or compiles one from source via node-gyp
  # if that fails. If no binding loads, msgpackr falls back to its pure-JS
  # encoder at runtime.
  msgpackr-extract: true
  # protobufjs: transitive dependency of @opentelemetry/sdk-node (via its OTLP
  # gRPC exporters and @grpc/proto-loader). Its postinstall only reads
  # package.json files to print a stderr warning if a *dependent* pins an
  # incompatible version scheme for protobufjs itself; no network access, no
  # compilation.
  protobufjs: true
  # unrs-resolver: native binary that eslint-plugin-import-x depends on
  # directly for module/TS-path resolution. Its postinstall only fetches a
  # prebuilt binary for the host platform; no arbitrary script.
  unrs-resolver: true
# Minutes (3 days). Matches renovate.json.
minimumReleaseAge: 4320
# Patched versions of transitive dependencies whose parents have not taken
# them yet. Each entry names the advisory it clears; remove it once every
# parent resolves a patched version on its own (`pnpm why <name>`).
overrides:
  # GHSA-h3mg-xc3c-68pw, GHSA-j6r3-76f7-8jcv: via express-rate-limit, which
  # calls only ipKeyGenerator (never isInSubnet). Production dependency.
  ip-address@<10.7.1: ^10.7.1
  # GHSA-68fv-2mgg-jv7q: via vitest > vite > postcss. Dev only.
  source-map-js@<1.2.2: ^1.2.2
  # GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7, GHSA-q2hr-2g5m-vwhr: via
  # commitizen's and eslint's minimatch, one entry per major line. Dev only.
  brace-expansion@>=1 <1.1.21: ^1.1.21
  brace-expansion@>=5 <5.0.12: ^5.0.12
  # GHSA-hrr3-gc8f-f4qj: via commitizen > @commitlint > ajv. Dev only.
  fast-uri@>=3 <3.1.8: ^3.1.8
  # GHSA-67mh-4wv8-2f99: drizzle-kit's legacy @esbuild-kit loader pins
  # esbuild 0.18; 0.25 is the version drizzle-kit itself already uses. Dev only.
  '@esbuild-kit/core-utils>esbuild': 0.25.12
auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 stack exhaustion on deeply nested brace patterns; no
    # patched version yet. Reached only via http-proxy-middleware > micromatch,
    # which runs when a proxy is given a glob pathFilter. The /collect proxy
    # passes none (default '/'), and braces parses patterns, never request
    # paths. Remove once braces ships a fix.
    - GHSA-vfj7-8cjw-p6xm
