# Minimal single-binary Tempo, local dev only. It receives OTLP/HTTP on 4318
# from otel-collector.yaml's otlphttp exporter; that port is not published to
# the host. Storage is the tempo-data volume (docker-compose.yml): traces
# survive a container restart, not a volume prune.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

metrics_generator:
  storage:
    path: /var/tempo/metrics
