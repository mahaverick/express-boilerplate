name: CI
on:
  # Every PR, whatever its base, so a stacked PR already carries the
  # required checks when GitHub retargets it to main.
  pull_request:
  # Called by deploy.yml as the gate before an image is built.
  workflow_call:
  workflow_dispatch:

# PR runs are grouped per PR, so a newer push cancels the older run. Push and
# dispatch runs, including deploy.yml's call, are grouped per commit, so no
# commit's gate is dropped or cancelled.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# `lint` needs no services, so it runs beside `test` and a lint failure
# surfaces without waiting for Postgres, Redis and Mailpit. `test` holds the
# steps that need them and the remaining checks.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Lint and type-check
        run: pnpm lint
      - name: Format check
        # Repo-wide: `prettier --check .` minus .prettierignore.
        run: pnpm format:check
      - name: Docs check
        run: pnpm lint:docs
      - name: Unused code check
        # Unused files, exports, types and dependencies; config in knip.jsonc.
        run: pnpm knip
      - name: Reject domain leakage
        # Fails on any term from .github/domain-terms.txt (one extended regex
        # per line) in any tracked file except that one. Scanning `git ls-files`
        # covers every committed file, whatever its extension, and never walks
        # node_modules, dist or coverage.
        #
        # A term that also reads as ordinary English needs an anchor: a
        # compound suffix (`term[-_]`) or a word boundary (`\bterm\b`). Before
        # adding one, write an ordinary sentence using the bare word and
        # confirm the gate does not trip on it.
        run: |
          terms=.github/domain-terms.txt
          # A blank line in the terms file is an empty pattern, which matches
          # every line of every file — the gate would "fail" on the whole tree
          # and read as a catastrophic leak. Refuse to run instead.
          if [ ! -s "$terms" ] || grep -qE '^[[:space:]]*$' "$terms"; then
            echo "::error::$terms is missing, empty, or contains a blank line"
            exit 1
          fi
          # `|| true` sits INSIDE the substitution so a no-match (grep exit 1)
          # and a partial match across xargs batches (xargs exit 123) both
          # still yield the hits grep printed. Testing the captured text, not
          # the pipeline's exit code, is what stops this gate silently
          # inverting into a pass once the repo outgrows a single xargs batch.
          # -H forces the filename prefix even when a batch holds one file.
          hits=$(git ls-files -z | grep -zv '^\.github/domain-terms\.txt$' \
                   | xargs -0 grep -nHiEf "$terms" || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Domain reference found — scrub before merging."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # GitHub's `services:` blocks cannot mount a file, so the init.sql that
      # docker-compose uses to create the test role/database is unavailable
      # here. Set the credentials directly instead — they must match .env.test.
      postgres:
        image: postgres:18
        env: { POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: boilerplate_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd=pg_isready --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5
      # The tests send real mail through this and read it back through
      # Mailpit's HTTP API on 8025. Default ports: no native service on a
      # hosted runner holds 1025/8025. Same tag as docker-compose.yml.
      #
      # The health check matters because sendMail never rejects: a Mailpit
      # that is not ready yet shows up as "expected 1 message, found 0", not
      # as a connection error.
      mailpit:
        image: axllent/mailpit:v1.31.1
        ports: ['1025:1025', '8025:8025']
        options: >-
          --health-cmd="/mailpit readyz" --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Run migrations
        run: pnpm db:migrate
        env:
          # migrate.ts opens its own connection from getDatabaseUrl(), not
          # database.service.ts's db/sql — so this step needs only
          # DATABASE_URL, the same as drizzle-kit's own generate/migrate/check
          # commands (see DATABASE.md).
          DATABASE_URL: postgres://test:test@localhost:5432/boilerplate_test
      - name: Test with coverage gate
        run: pnpm test:coverage
        env:
          # The services: above publish the container-default ports 5432/6379,
          # so DATABASE_URL/REDIS_URL here differ from .env.test (the compose
          # stack's deliberately-nonstandard 5433/6380, see docker-compose.yml)
          # in the port only.
          # Every other value mirrors .env.test verbatim, and the key sets
          # match both ways: the "Assert the CI env block mirrors .env.test"
          # step below compares this block with that file.
          APP_ENV: local
          NODE_ENV: test
          APP_PORT: 4040
          APP_URL: http://localhost:4040
          WEB_URL: http://localhost:5173
          DATABASE_URL: postgres://test:test@localhost:5432/boilerplate_test
          REDIS_URL: redis://localhost:6379
          DB_POOL_MAX: 2
          JWT_ACCESS_SECRET: test-access-secret-that-is-long-enough-32
          SESSION_SECRET: test-session-secret-that-is-long-enough-1
          SSE_HEARTBEAT_INTERVAL_MS: 1000
          SSE_MAX_STREAMS_PER_USER: 5
          LOG_LEVEL: silent
          REDIS_KEY_PREFIX: test
          SMTP_HOST: 127.0.0.1
          MAIL_FROM_TRANSACTIONAL: auth@mail.example.test
          ERROR_TRACKING_ENABLED: false
      # The env block above must mirror committed .env.test. When they drift, a
      # test passes locally and fails in CI (or worse, the reverse) for reasons
      # that look nothing like the cause. This compares both directions, keys
      # and values, and reads only that step's env: block: a key that appears
      # in another step (the migrations step's DATABASE_URL) or in a comment
      # does not count. The only difference allowed is the port in
      # DATABASE_URL and REDIS_URL.
      - name: Assert the CI env block mirrors .env.test
        shell: bash
        run: |
          ci=.github/workflows/ci.yml
          # KEY=value pairs from the "Test with coverage gate" step's env: block only,
          # not from any other step or service. Indentation decides scope: steps sit
          # at 6 spaces, a step's keys at 8, and its env: entries at 10.
          ci_env=$(awk '
            { match($0, /^ */); indent = RLENGTH }
            /^[[:space:]]*$/ { next }
            indent == 6 && /^ *- name: / { in_step = ($0 ~ /- name: Test with coverage gate[[:space:]]*$/); in_env = 0; next }
            indent <= 6 { in_step = 0; in_env = 0; next }
            in_step && indent == 8 && /^ *env:[[:space:]]*$/ { in_env = 1; next }
            in_env && indent <= 8 { in_env = 0 }
            in_env && indent == 10 && /^ *[A-Z][A-Z0-9_]*:/ {
              line = $0; sub(/^ */, "", line)
              key = line; sub(/:.*/, "", key)
              value = line; sub(/^[A-Z0-9_]*:[[:space:]]*/, "", value)
              print key "=" value
            }
          ' "$ci" | sort)
          env_test=$(grep -E '^[A-Z][A-Z0-9_]*=' .env.test | sort || true)
          if [ -z "$env_test" ]; then
            echo "::error::No KEY=value lines found in .env.test"
            exit 1
          fi
          if [ -z "$ci_env" ]; then
            echo "::error::No env: block found under the \"Test with coverage gate\" step in $ci"
            exit 1
          fi
          # The CI services publish the container-default ports 5432/6379, so these
          # two differ from .env.test (5433/6380) in the port only. Blank the port
          # in both before comparing.
          normalise() {
            sed -E '/^(DATABASE_URL|REDIS_URL)=/ s#:[0-9]+(/|$)#:<port>\1#' \
              | sed -E -e "s/^([A-Z0-9_]+)=\"(.*)\"\$/\\1=\\2/" -e "s/^([A-Z0-9_]+)='(.*)'\$/\\1=\\2/"
          }
          # Normalise outside <(...): a failure inside a process substitution is
          # invisible to -e and pipefail, and would let real drift pass.
          want=$(printf '%s\n' "$env_test" | normalise)
          got=$(printf '%s\n' "$ci_env" | normalise)
          if [ -z "$want" ] || [ -z "$got" ]; then
            echo "::error::normalise produced no output"
            exit 1
          fi
          rc=0
          diff_out=$(diff <(printf '%s\n' "$want") <(printf '%s\n' "$got")) || rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "::error::diff failed ($rc)"
            exit 1
          fi
          if [ "$rc" -eq 1 ]; then
            printf '%s\n' "$diff_out" | sed -n 's/^< /::error::only in .env.test (or a different value): /p; s/^> /::error::only in the CI test env (or a different value): /p'
            exit 1
          fi
          echo "CI test env and .env.test match ($(printf '%s\n' "$env_test" | wc -l | tr -d ' ') keys)"
      - name: Build
        run: pnpm build
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level moderate
      # Dev tooling never ships, so its advisories warn instead of failing the
      # build; a critical one still shows on the run as a failed, allowed step.
      - name: Audit all dependencies (non-blocking)
        continue-on-error: true
        run: pnpm audit --audit-level critical
      # .env.example is generated from the Zod schema. Nothing stops someone
      # editing EnvSchema and forgetting to regenerate, and the drift is
      # invisible until a new contributor's first run fails on a variable the
      # example never mentioned. Regenerate and fail if the file moves.
      - name: Assert .env.example matches the schema
        run: |
          pnpm env:example
          git diff --exit-code .env.example \
            || { echo "::error::.env.example is stale — run 'pnpm env:example' and commit"; exit 1; }

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the production image (no push)
        run: docker build --build-arg GIT_SHA=ci-release-check -t express-boilerplate:ci .
      - name: Run the image and check it starts with --enable-source-maps and reports its release
        run: |
          name=express-ci-sourcemaps
          # Fixed name, not a captured container id: lets cleanup run by name
          # from a trap, on every exit path (pass, fail, or a step timeout),
          # rather than only the ones this script itself anticipates.
          trap 'docker rm -f "$name" > /dev/null 2>&1 || true' EXIT
          cat > /tmp/express-boilerplate-ci.env <<'EOF'
          APP_ENV=local
          APP_URL=http://localhost:4040
          WEB_URL=http://localhost:5173
          DATABASE_URL=postgres://ci:ci@localhost:5432/ci
          REDIS_URL=redis://localhost:6379
          JWT_ACCESS_SECRET=0000000000000000000000000000000000000000000000
          SESSION_SECRET=1111111111111111111111111111111111111111111111
          WORKER_ENABLED=false
          EOF
          # DATABASE_URL/REDIS_URL point at nothing reachable on purpose: both
          # clients connect on first use, not at boot, so the process starts
          # and listens without them. WORKER_ENABLED=false skips BullMQ's
          # eager Redis connection.
          docker run -d --name "$name" --env-file /tmp/express-boilerplate-ci.env -p 4040:4040 express-boilerplate:ci
          for _ in $(seq 1 20); do
            if curl -sf http://localhost:4040/health > /dev/null; then break; fi
            sleep 0.5
          done
          # -eo pid,args, not -eo args alone: some Docker Engine builds reject
          # a single-column -eo with "Couldn't find PID field in ps output".
          # Guarded, so a container that already died prints its logs instead
          # of the step aborting under errexit with no diagnostics.
          top_output=$(docker top "$name" -eo pid,args) || { docker logs "$name"; exit 1; }
          echo "$top_output"
          if ! echo "$top_output" | grep -- '--enable-source-maps'; then
            echo "::error::--enable-source-maps is missing from the running process's args"
            docker logs "$name"
            exit 1
          fi
          # GIT_SHA becomes APP_VERSION, which /health reports as the release.
          release=$(curl -sf http://localhost:4040/health | jq -r .release)
          if [ "$release" != "ci-release-check" ]; then
            echo "::error::/health reports release '$release', expected the GIT_SHA build arg"
            docker logs "$name"
            exit 1
          fi
