name: Release

# On every push to main, release-please opens or updates the release PR from
# the conventional commits since the last release, and this workflow queues it
# for auto-merge. It merges once required checks pass; the next run tags
# vX.Y.Z, and the tag push makes deploy.yml promote the image main built.
#
# The token comes from a GitHub App: events made with GITHUB_TOKEN never start
# workflows, so its release PRs would get no CI and its tags no promotion.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Queue the release PR for auto-merge
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Raw string, parsed below: fromJSON('') fails the job when there is no PR.
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          pr_number=$(jq -r '.number // empty' <<<"${PR_JSON:-null}")
          if [ -z "$pr_number" ]; then
            echo "No release PR to merge."
            exit 0
          fi
          # A later push to main while the PR is queued finds auto-merge
          # already armed. Skip the merge below rather than re-run it: its
          # fallback can fail on the pending checks and turn the run red.
          if [ "$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json autoMergeRequest --jq '.autoMergeRequest != null')" = true ]; then
            echo "Auto-merge already queued."
            exit 0
          fi
          # The || runs whenever --auto is refused, for any reason. With
          # main's ruleset (see the README's one-time setup), the direct merge still
          # can't skip required checks; without it, it merges unchecked.
          gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --auto --squash --delete-branch \
            || gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
