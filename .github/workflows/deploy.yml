name: Deploy

# main → CI gate → image on GHCR → deploy. A vX.Y.Z tag (pushed by
# release.yml) builds nothing: promote adds the semver tags to the digest
# main already built and tested. The deploy job is a placeholder until a
# target (Cloud Run / GKE / VM) is chosen; replace its step then.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    if: github.ref_type != 'tag'
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: image-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=main,enable={{is_default_branch}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # Storage records need `artifact-metadata: write` and an org-owned
          # repo; without this it defaults to true and warns on every run.
          create-storage-record: false
      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          {
            echo "### Image"
            echo ""
            echo "\`$IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment: production
    # A manual dispatch from another branch builds and pushes an sha-tagged
    # image but never deploys.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy (placeholder — no target chosen yet)
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: echo "Would deploy $IMAGE@$DIGEST"

  promote:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: promote-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      SOURCE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for the image main built for this commit
        # The tag is pushed while main's run for the same commit may still be
        # building; 75 tries × 20s leaves room for setup inside the 30-minute timeout.
        # A tag that isn't vX.Y.Z fails here, before any polling.
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$VERSION is not a vX.Y.Z release tag"; exit 1; }
          for _ in $(seq 1 75); do
            if docker buildx imagetools inspect "$SOURCE" >/dev/null 2>&1; then
              echo "Found $SOURCE"
              exit 0
            fi
            sleep 20
          done
          echo "::error::$SOURCE did not appear after 75 tries (about 25 minutes)"
          exit 1
      - name: Add the semver tags to that digest
        run: |
          # VERSION was checked against vX.Y.Z by the wait step.
          v="${VERSION#v}"
          want=$(docker buildx imagetools inspect "$SOURCE" --format '{{json .Manifest}}' | jq -r .digest)
          docker buildx imagetools create \
            --tag "$IMAGE:$v" --tag "$IMAGE:${v%.*}" --tag "$IMAGE:${v%%.*}" \
            "$SOURCE@$want"
          for t in "$v" "${v%.*}" "${v%%.*}"; do
            got=$(docker buildx imagetools inspect "$IMAGE:$t" --format '{{json .Manifest}}' | jq -r .digest)
            if [ "$got" != "$want" ]; then
              echo "::error::$IMAGE:$t is $got, expected $want"
              exit 1
            fi
          done
          {
            echo "### Promoted"
            echo ""
            echo "\`$IMAGE@$want\` → \`$v\`, \`${v%.*}\`, \`${v%%.*}\`"
          } >> "$GITHUB_STEP_SUMMARY"
