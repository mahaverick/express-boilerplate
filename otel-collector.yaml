receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
exporters:
  debug:
    verbosity: normal
  # Traces go to the tempo service on its container-internal 4318. `debug`
  # stays in each pipeline so `docker compose logs otel-collector` shows them
  # without Grafana.
  otlphttp:
    endpoint: http://tempo:4318
  # Loki 3.x ingests OTLP natively at /otlp; the collector appends
  # /v1/logs itself. trace_id/span_id arrive as structured metadata.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
# /health on 13133, reachable from the host. docker-compose.yml has no
# HEALTHCHECK for this service: the image is distroless (no sh, wget or curl),
# and a Docker healthcheck runs inside the container.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
service:
  extensions: [health_check]
  pipelines:
    traces: { receivers: [otlp], exporters: [otlphttp, debug] }
    metrics: { receivers: [otlp], exporters: [debug] }
    logs: { receivers: [otlp], exporters: [otlphttp/loki, debug] }
